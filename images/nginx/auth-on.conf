# Basic auth on the storefront (HTPASSWD=on in .env, e.g. staging). Users are in the project root
# file .htpasswd (bin/setup-htpasswd), mounted with the whole project at /var/www and outside the
# web root, so it is never served and bin/update never touches it.
auth_basic "Restricted Area";
auth_basic_user_file /var/www/.htpasswd;

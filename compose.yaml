# Published ports bind to 127.0.0.1 only (random host port, see `docker port <container>`): reachable
# from the host / an ssh tunnel for debugging, never from the internet. Traffic goes through
# nginx-proxy and the docker networks, not through these ports.
# Container logs (docker json-file driver) are rotated so they can't fill the disk.
# Tune per project in .env: LOG_MAX_SIZE / LOG_MAX_FILE.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "${LOG_MAX_SIZE:-10m}"
    max-file: "${LOG_MAX_FILE:-3}"

services:
  {{project_name}}-nginx:
    container_name: {{project_name}}-nginx
    logging: *default-logging
    restart: unless-stopped
    image: nginx:1.27
    volumes:
      - ./:/var/www
      - ./images/nginx/default.conf:/etc/nginx/conf.d/custom.conf
      - ./images/nginx/magento.conf:/etc/nginx/magento.conf
      # Basic auth on / off from .env HTPASSWD (bin/setup-htpasswd)
      - ./images/nginx/auth-${HTPASSWD:-off}.conf:/etc/nginx/auth.conf:ro
    ports:
      - "127.0.0.1::80"
    depends_on:
      {{project_name}}-php:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - nginx-proxy
      - {{project_name}}-network
    environment:
      - VIRTUAL_HOST=${DOMAIN_HOSTS}
      - SELF_SIGNED_HOST=${DOMAIN_HOSTS}
      - VIRTUAL_PORT=80
      - LETSENCRYPT_HOST=${DOMAIN_HOSTS}
      - LETSENCRYPT_EMAIL=${DOMAIN_EMAIL}

  {{project_name}}-php:
    container_name: {{project_name}}-php
    logging: *default-logging
    restart: unless-stopped
    user: ${USER_ID}:${GROUP_ID}
    build:
      dockerfile: Dockerfile
      context: images/php/${PHP_VERSION}
      args:
        - USER_ID=${USER_ID}
        - GROUP_ID=${GROUP_ID}
    environment:
      - ECOMSCAN_EMAIL=${ECOMSCAN_EMAIL:-alin.munteanu@roweb.com}
      - ECOMSCAN_LICENSE_KEY=${ECOMSCAN_LICENSE_KEY:-trial}
      - ECOMSCAN_MIN_CONFIDENCE=${ECOMSCAN_MIN_CONFIDENCE:-50}
    volumes:
      - ./:/var/www
      - ./images/php/${PHP_VERSION}/conf/php.ini:/usr/local/etc/php/conf.d/php.ini
      - ./images/php/${PHP_VERSION}/conf/supervisord.conf:/etc/supervisor/conf.d/supervisord.conf
    tmpfs:
      - /dev/shm
    depends_on:
      {{project_name}}-db:
        condition: service_healthy
      {{project_name}}-redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - mail-catcher-network
      - open-search-network
      - rabbitmq-network
      - {{project_name}}-network

  {{project_name}}-redis:
    container_name: {{project_name}}-redis
    logging: *default-logging
    image: valkey/valkey:8.1-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1::6379"
    networks:
      - {{project_name}}-network
    volumes:
        - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ping 2>/dev/null || redis-cli ping"]
      interval: 10s
      timeout: 5s
      retries: 6

  {{project_name}}-db:
    container_name: {{project_name}}-db
    logging: *default-logging
    image: mariadb:11.8
    restart: unless-stopped
    command:
      --max_allowed_packet=64M
      --optimizer_use_condition_selectivity=1
      --optimizer_switch="rowid_filter=off"
      --innodb_buffer_pool_size=${DB_BUFFER_POOL_SIZE:-4G}
      --innodb_log_buffer_size=256M
      --innodb_log_file_size=1G
      --innodb_write_io_threads=16
    environment:
      # No MYSQL_HOST here: the entrypoint's mariadb-upgrade reads it and misses the socket-only
      # temporary server. Upgrades the data directory when the image version changes (ex. 11.4 -> 11.8).
      MARIADB_AUTO_UPGRADE: "1"
      MYSQL_DATABASE: "${MYSQL_DATABASE}"
      MYSQL_USER: "${MYSQL_USER}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
    ports:
      - "127.0.0.1::3306"
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      # ping answers as soon as the server accepts connections, no credentials needed
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 --silent || mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - shared-db-network
      - {{project_name}}-network

volumes:
  dbdata:
  redisdata:

networks:
  nginx-proxy:
    external: true
  shared-db-network:
    external: true
  {{project_name}}-network:
  open-search-network:
    external: true
  mail-catcher-network:
    external: true
  rabbitmq-network:
    external: true
